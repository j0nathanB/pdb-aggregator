# .github/workflows/deploy-and-notify.yml
# Deploy to GitHub Pages and trigger email distribution on success
#
# Copy this file to your ideal-brief-site repo's .github/workflows/ directory

name: Deploy and Notify

on:
  push:
    branches: ["main"]
    paths:
      - "_briefs/**"
      - "_data/**"
      - "_layouts/**"
      - "_includes/**"
      - "assets/**"
      - "_config.yml"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send email after deploy'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ideal-brief-content
          path: _content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}

      - name: Merge content into site
        run: |
          cp -r _content/_briefs ./_briefs 2>/dev/null || true
          cp -r _content/_data ./_data 2>/dev/null || true
          echo "Content merged successfully"
          ls -la _briefs/ 2>/dev/null || echo "No briefs yet"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Validate brief schema
        run: |
          if [ -f "scripts/validate_brief.py" ]; then
            python3 scripts/validate_brief.py
          else
            echo "No validation script found, skipping"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    # Only send email if:
    # 1. Push event with brief changes, OR
    # 2. Manual trigger with send_email=true
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.send_email == 'true')
    steps:
      - name: Extract brief date from commit
        id: extract
        run: |
          # Try to extract date from commit message or changed files
          # Expected format: "Brief: Week of 2026-02-08" or similar
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          # Extract date pattern YYYY-MM-DD
          BRIEF_DATE=$(echo "$COMMIT_MSG" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)

          if [ -z "$BRIEF_DATE" ]; then
            # Fallback: use last Saturday's date
            BRIEF_DATE=$(date -d "last saturday" +%Y-%m-%d 2>/dev/null || date -v-sat +%Y-%m-%d)
          fi

          echo "brief_date=$BRIEF_DATE" >> $GITHUB_OUTPUT
          echo "Detected brief date: $BRIEF_DATE"

      - name: Wait for CDN propagation
        run: sleep 30

      - name: Verify deployment is live
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          echo "Checking: $URL"

          for i in 1 2 3; do
            if curl -sf "$URL" > /dev/null; then
              echo "Site is live!"
              exit 0
            fi
            echo "Attempt $i failed, waiting..."
            sleep 10
          done

          echo "Warning: Could not verify site, proceeding anyway"

      - name: Trigger email distribution
        run: |
          RESPONSE=$(curl -sf -X POST "${{ secrets.EMAIL_TRIGGER_WEBHOOK }}/send" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.API_GATEWAY_KEY }}" \
            -d '{
              "brief_date": "${{ steps.extract.outputs.brief_date }}",
              "deployed_url": "${{ needs.deploy.outputs.page_url }}"
            }')

          echo "Response: $RESPONSE"

          # Check if emails were sent
          SENT=$(echo "$RESPONSE" | jq -r '.sent // 0')
          SKIPPED=$(echo "$RESPONSE" | jq -r '.skipped // 0')

          echo "Emails sent: $SENT, skipped: $SKIPPED"

          if [ "$SENT" -eq 0 ] && [ "$SKIPPED" -eq 0 ]; then
            echo "Warning: No emails sent or skipped"
          fi
