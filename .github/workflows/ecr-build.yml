name: Build and push pipeline image to ECR

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Rebuild on every push to main so the :latest ECR image always
    # matches HEAD — protects against the "Fargate task launches, clones
    # old code from a stale image entrypoint" class of drift. Docker
    # layer cache makes non-dep-changing rebuilds fast (~3-4 min).
    # Auto-restart of running tasks is intentionally NOT wired up; pushes
    # should never kill an in-progress run. Launch new tasks manually.

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ideal-brief-prod-pipeline

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::307019866705:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
