name: Deploy to GitHub Pages & Notify

on:
  push:
    branches: [main]
    paths:
      - '_briefs/**'
      - '_layouts/**'
      - '_config.yml'
      - 'index.html'
      - 'assets/**'
      - 'Gemfile'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send email notification after deploy'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.send_email == 'true')
    steps:
      - name: Wait for deployment to propagate
        run: sleep 30

      - name: Verify deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ needs.deploy.outputs.page_url || format('https://j0nathanb.github.io/pdb-aggregator/') }}")
          echo "Site returned HTTP $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "::warning::Site returned HTTP $STATUS"
          fi

      - name: Trigger email webhook
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.EMAIL_TRIGGER_WEBHOOK }}
          API_KEY: ${{ secrets.API_GATEWAY_KEY }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "EMAIL_TRIGGER_WEBHOOK secret not set, skipping email trigger"
            exit 0
          fi

          # Extract brief date from changed _briefs/YYYY-MM-DD/ paths (if present)
          BRIEF_DATE=$(git diff --name-only HEAD~1 HEAD -- '_briefs/' 2>/dev/null \
            | grep -oP '(?<=_briefs/)\d{4}-\d{2}-\d{2}' \
            | head -1)

          # Build payload — brief_date is optional, Lambda auto-discovers if omitted
          if [ -n "$BRIEF_DATE" ]; then
            PAYLOAD="{\"brief_date\": \"${BRIEF_DATE}\"}"
            echo "Triggering email for brief: $BRIEF_DATE"
          else
            PAYLOAD="{}"
            echo "Triggering email (Lambda will auto-discover latest brief)"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${API_KEY}" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Webhook response: HTTP $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Email webhook returned HTTP $HTTP_CODE"
          fi
