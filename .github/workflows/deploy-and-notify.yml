name: Notify on Brief Publish

on:
  push:
    branches: [main]
    paths:
      - 'briefs/**'
      - 'mint.json'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send email notification'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# Mintlify Cloud handles deployment automatically via GitHub integration.
# This workflow only triggers email notifications when new briefs are pushed.

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.send_email == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for Mintlify deployment to propagate
        run: sleep 45

      - name: Trigger email webhook
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.EMAIL_TRIGGER_WEBHOOK }}
          API_KEY: ${{ secrets.API_GATEWAY_KEY }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "EMAIL_TRIGGER_WEBHOOK secret not set, skipping email trigger"
            exit 0
          fi

          # Extract brief date from changed briefs/YYYY-MM-DD/ paths (if present)
          BRIEF_DATE=$(git diff --name-only HEAD~1 HEAD -- 'briefs/' 2>/dev/null \
            | grep -oP '(?<=briefs/)\d{4}-\d{2}-\d{2}' \
            | head -1)

          # Build payload — brief_date is optional, Lambda auto-discovers if omitted
          if [ -n "$BRIEF_DATE" ]; then
            PAYLOAD="{\"brief_date\": \"${BRIEF_DATE}\"}"
            echo "Triggering email for brief: $BRIEF_DATE"
          else
            PAYLOAD="{}"
            echo "Triggering email (Lambda will auto-discover latest brief)"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${API_KEY}" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Webhook response: HTTP $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Email webhook returned HTTP $HTTP_CODE"
          fi
