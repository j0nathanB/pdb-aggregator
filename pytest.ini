[pytest]
markers =
    slow: tests that take minutes to run (real API calls or large fixtures). Run with `pytest -m slow`.
    integration: end-to-end tests that exercise real external services.
# Default run: skip slow/integration tests and the chronically-flaky Mexico e2e.
# See memory/project_mexico_e2e_flaky.md for the Mexico hang investigation.
addopts = -m "not slow and not integration" --ignore=tests/monitor/test_e2e_mexico.py
