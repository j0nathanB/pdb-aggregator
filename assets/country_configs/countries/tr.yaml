blind_spots:
- domain: Kurdish peace process and PKK dissolution
  reason: Negotiations between Erdogan-Bahçeli alliance and Öcalan/DEM party are opaque;
    constitutional amendment linkage unclear
  where_signal_lives: Kurdish media (ANF, Rudaw), DEM Party statements, Turkish MoD
    communiqués, ICG Turkey reports
- domain: Monetary policy independence
  reason: Presidential pressure on TCMB rate decisions is structural but difficult
    to verify in real time
  where_signal_lives: TCMB meeting minutes, Financial Times Turkey coverage, IMF Article
    IV consultations
- domain: İmamoğlu trial and judicial independence
  reason: Opposition leader's imprisonment and trial politicized; 90% of media is
    government-aligned
  where_signal_lives: Bianet/Medyascope independent coverage, ECHR rulings, Venice
    Commission opinions
