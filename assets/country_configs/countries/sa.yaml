- domain: Yemen conflict and regional proxies
  reason: Saudi military operations and Iran-aligned Houthi engagement details are
    tightly controlled
  where_signal_lives: UN Panel of Experts reports, ACLED data, Houthi media channels
- domain: Vision 2030 implementation gaps
