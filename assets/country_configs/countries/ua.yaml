blind_spots:
- domain: Frontline military operations
  reason: Operational security restrictions limit real-time reporting on force dispositions,
    casualties, and equipment losses
  where_signal_lives: General Staff daily briefings, DeepState/Militarnyy maps, OSINT
    analysts, ISW assessments
- domain: Reconstruction and aid diversion
  reason: Wartime governance constraints limit oversight of international aid flows
    and reconstruction contracts
  where_signal_lives: NABU investigations, EU audit reports, RISE/Slidstvo.info investigative
    coverage
