blind_spots:
- domain: Nuclear weapons program and missile development
  reason: Operational details classified; ISPR is the only domestic channel and treats
    nuclear posture as strategic communication
  where_signal_lives: SIPRI/IISS assessments, Federation of American Scientists, ISPR
    statements, Indian/Western intelligence community leaks
- domain: ISI domestic operations and political manipulation
  reason: Internal enforcement role obscured by structural media capture; PECA criminalises
    most reporting
  where_signal_lives: HRW and Amnesty reports, PTM testimony, leaked diplomatic cables,
    diaspora investigative outlets, Dawn boundary-pushing reporting
- domain: Balochistan insurgency and security operations
  reason: Internet shutdowns and unofficial censorship; restricted journalist access
  where_signal_lives: BLA claim statements, satellite imagery, Frontier Corps press
    releases, diaspora Baloch media, occasional Dawn investigations
- domain: Military-corporate (Milbus) finances
  reason: Fauji Foundation, AWT, DHA, Bahria/Shaheen Foundations are opaque; not subject
    to civilian audit
  where_signal_lives: Ayesha Siddiqa research, parliamentary questions, EPBD Wealth
    Perception Index, Federal Board of Revenue disputes
- domain: PTI suppression details and internal party state
  reason: Court restrictions on coverage of Imran Khan cases; ECP and judiciary controlled
    via 27th Amendment
  where_signal_lives: Court documents, defence team statements, diaspora PTI channels,
    HRW reporting, diplomatic démarches
