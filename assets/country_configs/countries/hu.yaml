blind_spots:
- domain: NER oligarch network finances and asset concealment
  reason: Mészáros, Tiborcz, Garancsi holdings are opaque; regime-era procurement records
    selectively available; transition incentives create risk of politically selective exposure
  where_signal_lives: Átlátszó and Direkt36 investigations, Transparency International
    Hungary, EU OLAF reports, Commercial Court filings, leaked procurement databases
- domain: Intelligence service operations (IH, KNBSZ, SPO)
  reason: Civilian Information Office and Military National Security Service operate
    under classified mandates; SPO investigations were opaque and politically targeted
  where_signal_lives: Parliamentary oversight committee filings, Direkt36 Pegasus
    reporting, EU Parliament LIBE committee inquiries, diaspora reporting on domestic surveillance
- domain: Judicial capture and informal influence networks
  reason: Fidesz-packed Constitutional Court and Kúria operate with fixed terms extending
    past transition; informal patronal networks between executive and judiciary largely
    undocumented
  where_signal_lives: Hungarian Helsinki Committee case tracking, European Commission
    rule-of-law reports, CEPEJ judicial independence assessments, Venice Commission opinions
- domain: Russian influence operations (energy, information, intelligence)
  reason: Paks II project and Druzhba/TurkStream dependency create structural leverage;
    Russian intelligence reportedly received EU discussion contents from Orbán-era
    officials; influence channels often move via informal networks
  where_signal_lives: Direkt36 investigations, Reuters and Bellingcat OSINT, EU sanctions
    monitoring, VSquare regional investigative journalism, US Treasury OFAC designations
- domain: KESMA coordinated editorial direction
  reason: Central European Press and Media Foundation pools ~500 outlets under single
    editorial control; formally exempt from competition review; coordination between
    outlets undocumented
  where_signal_lives: Mérték Media Monitor reports, Atlatszo KESMA investigations,
    RSF Hungary press freedom reporting, IPI and ECPMF bulletins
